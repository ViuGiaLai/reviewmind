services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviewmind
      POSTGRES_USER: reviewmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewmind -d reviewmind"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      REVIEWMIND_PG_DSN: postgresql://reviewmind:${POSTGRES_PASSWORD}@postgres:5432/reviewmind
      REVIEWMIND_STORAGE_PATH: /app/data/uploads
      REVIEWMIND_ENVIRONMENT: ${REVIEWMIND_ENVIRONMENT:-production}
      REVIEWMIND_DEBUG: "false"
      REVIEWMIND_CORS_ORIGINS: ${REVIEWMIND_CORS_ORIGINS:-http://localhost:8080}
      REVIEWMIND_PG_POOL_SIZE: ${REVIEWMIND_PG_POOL_SIZE:-10}
      REVIEWMIND_PG_MAX_OVERFLOW: ${REVIEWMIND_PG_MAX_OVERFLOW:-20}
      REVIEWMIND_DB_STATEMENT_TIMEOUT_MS: ${REVIEWMIND_DB_STATEMENT_TIMEOUT_MS:-30000}
      REVIEWMIND_MAX_CONCURRENT_REVIEWS: ${REVIEWMIND_MAX_CONCURRENT_REVIEWS:-4}
      REVIEWMIND_REVIEW_QUEUE_TIMEOUT_SECONDS: ${REVIEWMIND_REVIEW_QUEUE_TIMEOUT_SECONDS:-2}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_DOMAIN: ${CLERK_DOMAIN:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
    volumes:
      - document_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
